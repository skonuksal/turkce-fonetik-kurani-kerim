name: Android okunuş denetimi
on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'output/**'
      - 'demo/**'
      - 'apk-build/**'
      - 'test/**'
      - 'checks/reader-tap.cjs'
      - 'generate.js'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run generate && npm test
      - run: git diff --exit-code -- output apk-build/www/output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npx --no-install cap sync android
        working-directory: apk-build
      - run: bash gradlew assembleDebug --no-daemon
        working-directory: apk-build/android
      - name: APK içindeki okuyucuda mobil dokunmayı denetle
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-check" --no-audit --no-fund playwright-core@1.56.1
          unzip -q apk-build/android/app/build/outputs/apk/debug/app-debug.apk 'assets/public/*' -d "$RUNNER_TEMP/reader-apk"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/reader-apk/assets/public" > "$RUNNER_TEMP/reader-http.log" 2>&1 &
          trap 'kill $!' EXIT
          curl --silent --fail --retry 8 --retry-connrefused http://127.0.0.1:4173/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/reader-check/node_modules" node checks/reader-tap.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: turkce-fonetik-onizleme
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
